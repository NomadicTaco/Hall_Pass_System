<script>

modal("You’re in line","Everyone’s spots are taken right now. When it’s your turn, tap Start pass to leave.",[["OK"]])}else issue(st,ty)}

function tick(){document.querySelectorAll(".tm").forEach(e=>{const s=Math.max(0,Math.floor((Date.now()-e.dataset.t)/1000));e.textContent=pad(Math.floor(s/60))+":"+pad(s%60)})}

if(Date.now()<lockUntil)return login("Too many tries. Wait a few seconds.");

function setPin(first,msg){modal(first?"Set up teacher PIN":"Change teacher PIN",(msg?`<span style="color:var(--er)">${msg}</span><br>`:"")+`<input id="p1" type="password" inputmode="numeric" autocomplete="off" placeholder="New PIN (4 to 12 digits)" style="width:100%;margin-bottom:8px"><input id="p2" type="password" inputmode="numeric" autocomplete="off" placeholder="Confirm PIN" style="width:100%">`,[["Cancel"],["Save PIN",async()=>{
const a=$("#p1").value,b=$("#p2").value;if(!/^\d{4,12}$/.test(a))return setPin(first,"Use 4 to 12 digits.");if(a!==b)return setPin(first,"The PINs don’t match.");
try{const salt=crypto.getRandomValues(new Uint32Array(3)).join("-");S.auth={salt,hash:await hp(a,salt)};T=true;idle=Date.now();save();render()}catch(e){modal("Couldn’t save PIN","This browser can’t create a PIN.",[["OK"]],1)}},1]]);foc("#p1")}
const CF=["p","bs","be","types","periods","students","sp","maxOut","auth"],COL={passes:"passes",reqs:"reqs",q:"queue"};
try{const q=new URLSearchParams(location.search).get("sync");if(q){localStorage.setItem("hpdb",q);history.replaceState(null,"",location.pathname)}}catch(e){}
let U=(SYNC_URL||localStorage.getItem("hpdb")||"").trim().replace(/\.json$/i,"").replace(/\/+$/,""),live=false,lastCfg="",last={passes:{},reqs:{},q:{}},chain=Promise.resolve(),pend=0,wseq=0;
const setSy=t=>{const e=$("#sy");if(e)e.textContent=t};
const cfgOf=()=>CF.reduce((a,k)=>(a[k]=S[k]===undefined?null:S[k],a),{});
const key=id=>String(id).replace(/\./g,"_");
function w(fn){pend++;wseq++;chain=chain.then(fn).catch(()=>setSy("Sync problem: the last change may not have saved")).then(()=>{pend--})}
const rq=(path,body)=>fetch(U+"/"+path+".json",{method:"PUT",body:JSON.stringify({j:body})}).then(r=>{if(!r.ok)throw 0});

for(const k in COL){const cur={};S[k].forEach(x=>cur[key(x.id)]=JSON.stringify(x));

function adopt(k,list){const arr=list.map(x=>JSON.parse(x.j)).sort((a,b)=>a.id-b.id),m={};
arr.forEach(x=>m[key(x.id)]=JSON.stringify(x));last[k]=m;

function adoptCfg(j){const o=JSON.parse(j),t=JSON.stringify(CF.reduce((a,k)=>(a[k]=o[k]===undefined?S[k]:o[k],a),{}));

async function connect(){if(!U){setSy("This device only. Add a sync address in Teacher › Settings.");return}

setSy("● Syncing across devices");setInterval(poll,3000);addEventListener("focus",poll)}catch(e){setSy(e===401||e===403?"Permission denied: check the database rules, and that the address ends with /hp/ and your class code.":e===404?"Address not found: check the database URL.":"Can’t reach the sync database. Check the address and internet, a school filter, and that this page isn’t open inside Claude.")}}

function setUrl(){const v=$("#sy-url").value.trim();try{v?localStorage.setItem("hpdb",v):localStorage.removeItem("hpdb")}catch(e){}location.reload()}

setTimeout(connect,0);
let R={from:null,to:null,per:"all",kind:"log",c:{student:1,period:1,type:1,date:1,out:1,back:1,dur:1,exc:1}};
const CL={student:"Student",period:"Period",type:"Pass type",date:"Date",out:"Time out",back:"Time back",dur:"Minutes out",exc:"Exception"};
function rows(){R.from=R.from||S.p.start;R.to=R.to||S.p.end;

function toList(rows,pdf){let nc=0,pc=-1,fc=-1,lc=-1,st=0;

const out=[];rows.slice(st).forEach(r=>{let n,p="";
if(fc>-1||lc>-1)n=[fc>-1?r[fc]:"",lc>-1?r[lc]:""].map(x=>String(x||"").trim()).filter(Boolean).join(" ");else n=String(r[Math.max(nc,0)]||"").trim();

async function upl(inp){const f=inp.files[0];inp.value="";if(!f)return;let list=[];
try{const buf=await f.arrayBuffer();

const pdf=await pdfjsLib.getDocument({data:buf}).promise,lines=[];
for(let i=1;i<=pdf.numPages;i++){const tc=await(await pdf.getPage(i)).getTextContent(),g={};
tc.items.forEach(t=>{const y=Math.round(t.transform[5]/3);(g[y]=g[y]||[]).push(t)});
Object.keys(g).map(Number).sort((a,b)=>b-a).forEach(y=>lines.push(g[y].sort((a,b)=>a.transform[4]-b.transform[4]).map(t=>t.str).join(" ").replace(/\s+/g," ").trim()))}
list=toList(lines.map(l=>[l]),1)}
else{const wb=XLSX.read(buf,{type:"array"});list=toList(XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:""}))}
}catch(e){return modal("Couldn’t read that file","Try a spreadsheet (.xlsx or .csv), or a PDF with selectable text rather than a scan.",[["OK"]],1)}
if(!list.length)return modal("No students found","No names were found in that file.",[["OK"]],1);
modal("Import "+list.length+" students?",esc(list.slice(0,6).map(x=>x.n).join(", "))+(list.length>6?"…":""),[["Cancel"],["Add to roster",()=>imp(list,0)],["Replace roster",()=>imp(list,1),1]])}
function imp(list,rp){if(rp){S.students=[];S.sp={}}
list.forEach(x=>{if(S.students.includes(x.n))return;S.students.push(x.n);
if(x.p){const v=x.p.toLowerCase(),dv=v.replace(/\D/g,"");let pr=S.periods.find(p=>p.name.toLowerCase()===v||(dv!==""&&p.name.replace(/\D/g,"")===dv));
if(!pr){pr={id:"p"+Date.now()+S.periods.length,name:x.p.length<=2?"Period "+x.p:x.p,start:"10:00",end:"10:50"};S.periods.push(pr)}S.sp[x.n]=pr.id}});
save();render()}
function tab(v){view=v;render()}
function modal(title,body,btns,bad){$("#mb").className="box"+(bad?" bad":"");
$("#mb").innerHTML=`<h2>${title}</h2><p>${body}</p><div class="row" style="justify-content:flex-end" id="mbtn"></div>`;
btns.forEach(b=>{const e=document.createElement("button");e.textContent=b[0];if(b[2])e.className="p";e.onclick=()=>{$("#modal").style.display="none";b[1]&&b[1]()};$("#mbtn").appendChild(e)});
$("#modal").style.display="flex"}
function issue(st,ty,exc){S.passes.push({id:Date.now()+Math.random(),student:st,type:ty,out:now().getTime(),outR:Date.now(),back:null,exc:!!exc});save();render()}
function ask(st,ty,kind){S.reqs.push({id:Date.now()+Math.random(),student:st,type:ty,kind});save();render();
modal("Request sent","Your teacher has been notified. Wait for approval before leaving.",[["OK"]])}
function request(st,ty){const d=now(),k=ymd(d);
if(active(st))return modal("Already out","You already have a pass out. Return it first.",[["OK"]],1);
if(k<S.p.start||k>S.p.end)return modal("Outside the grading period","Passes can only be used between "+S.p.start+" and "+S.p.end+".",[["OK"]],1);
const m=mins(d),per=perOf(st);
if(!per||!(tm(per.start)<=m&&m<tm(per.end)))return modal("Class not in session",`Passes can only be used during ${per?esc(per.name)+" ("+fm(tm(per.start))+" – "+fm(tm(per.end))+")":"your class period"}.`,[["OK"]],1);
if(S.q.some(x=>x.student===st))return modal("Already in line","You’re already in line. Wait for your turn.",[["OK"]],1);
const a=m-tm(per.start),b=tm(per.end)-m;
if(a<S.bs||b<S.be){const why=a<S.bs?`the first ${S.bs} minutes`:`the last ${S.be} minutes`;
return modal("Passes are closed right now",`No passes are allowed during ${why} of class. Open window: ${fm(tm(per.start)+S.bs)} – ${fm(tm(per.end)-S.be)}.`,[["Cancel"],["Ask teacher",()=>ask(st,ty,"Blackout override"),1]],1)}
const u=used(st,ty),l=lim(ty);
if(u>=l)return modal("⚠ You’re about to exceed your limit",`You have used ${u} of ${l} ${esc(ty)} passes this 9 weeks. Another one needs your teacher’s approval.`,[["Cancel"],["Request exception",()=>ask(st,ty,"Over limit"),1]],1);
if(u+1===l)return modal("⚠ Last pass warning",`This is your last ${esc(ty)} pass for this 9 weeks (${u+1} of ${l}). Any more will need teacher approval.`,[["Cancel"],["Use my last pass",()=>go(st,ty),1]]);
go(st,ty)}
function back(id){const p=S.passes.find(x=>x.id===id);p.back=now().getTime();p.backR=Date.now();save();render()}
function approve(id){const r=S.reqs.find(x=>x.id===id);S.reqs=S.reqs.filter(x=>x!==r);
if(active(r.student))S.reqs.push(r);else issue(r.student,r.type,true);save();render()}
function deny(id){S.reqs=S.reqs.filter(x=>x.id!==id);save();render()}
function set(path,v,num){const k=path.split(".");let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k.at(-1)]=num?+v:v;save();render()}
const flip=()=>{S.sim.on=!S.sim.on;save();render()};
const add=(w)=>{if(w==="t")S.types.push({name:"New pass",limit:2});if(w==="p")S.periods.push({id:"p"+Date.now(),name:"Period "+(S.periods.length+1),start:"10:00",end:"10:50"});
if(w==="s"){const v=$("#ns").value.trim();if(v)S.students.push(v)}save();render()};
const rm=(w,i)=>{S[w].splice(i,1);save();render()};
function weekNo(){const d=ymd(now());const w=Math.floor((new Date(d)-new Date(S.p.start))/6048e5)+1;return d<S.p.start?"not started":d>S.p.end?"ended":"week "+w+" of 9"}
function render(){if(!T&&view!=="s")view="s";$("#t-s").className=view==="s"?"on":"";$("#t-t").hidden=$("#t-r").hidden=!T;$("#t-l").textContent=T?"Lock":"🔒 Teacher login";$("#t-t").className=view==="t"?"on":"";$("#t-r").className=view==="r"?"on":"";
const d=now(),m=mins(d),per=perAt(m);let stat="";
if(per){const a=m-tm(per.start),b=tm(per.end)-m,cl=a<S.bs||b<S.be;
stat=cl?`<div class="st no">${per.name} · ${fm(m)} · Passes closed (open ${fm(tm(per.start)+S.bs)} – ${fm(tm(per.end)-S.be)})</div>`:`<div class="st ok">${per.name} · ${fm(m)} · Passes open until ${fm(tm(per.end)-S.be)}</div>`}
else stat=`<div class="st no">${fm(m)} · No class period in session</div>`;
$("#app").innerHTML=(S.sim.on&&T?`<div class="mu" style="margin-bottom:6px">Test clock is on (${esc(S.sim.t.replace("T"," "))}). Change it in Teacher › Settings.</div>`:"")+stat+(view==="s"?stu():view==="r"?rep():tea());tick()}
function stu(){const cp=perAt(mins(now())),ro=cp?S.students.filter(s=>(perOf(s)||{}).id===cp.id):[];if(!ro.includes(me))me="";
const ap=me?active(me):null;
return`<div class="card"><div class="row"><b>${cp?esc(cp.name)+" · tap your name":"No class period in session"}</b></div><div class="grid">${ro.map(s=>`<button class="pb ${s===me?"on":""}" data-s="${esc(s)}" onclick="me=this.dataset.s;render()"><b>${esc(s)}</b>${active(s)?`<span>Out now</span>`:""}</button>`).join("")||`<span class="mu">No students are assigned to this period.</span>`}</div>
${ap?`<div class="st no" style="margin:10px 0">Out on a ${esc(ap.type)} pass since ${ft(ap.out)}${ap.outR?` · <b class="tm" data-t="${ap.outR}"></b>`:""}. <button class="p" onclick="back(${ap.id})">I’m back</button></div>`:""}
<div class="grid" style="margin-top:12px">${me?S.types.map(t=>{const u=used(me,t.name),c=u>=t.limit?"full":u+1===t.limit?"last":"";
return`<button class="pb ${c}" onclick="request(me,${JSON.stringify(t.name).replace(/"/g,"&quot;")})"><b>${esc(t.name)}</b><span>${u} of ${t.limit} used</span></button>`}).join(""):`<span class="mu">Select your name to choose a pass.</span>`}</div>${qv()}
<p class="mu">Limits reset each 9 weeks (${S.p.start} to ${S.p.end}).</p></div>`}
function tea(){const ts=S.types;
return`<div class="card"><h2>Approval requests (${S.reqs.length})</h2>${S.reqs.length?S.reqs.map(r=>`<div class="row"><span><b>${esc(r.student)}</b> · ${esc(r.type)} · <span class="mu">${r.kind}</span></span><button class="p" onclick="approve(${r.id})">Approve</button><button class="d" onclick="deny(${r.id})">Deny</button></div>`).join(""):`<span class="mu">No pending requests.</span>`}</div>
${qt()}<div class="card"><h2>Out now</h2>${S.passes.filter(p=>!p.back).map(p=>`<div class="row"><span><b>${esc(p.student)}</b> · ${esc(p.type)} · since ${ft(p.out)}${p.outR?` · <b class="tm" data-t="${p.outR}"></b>`:""}${p.exc?" (exception)":""}</span><button onclick="back(${p.id})">Mark returned</button></div>`).join("")||`<span class="mu">Nobody is out.</span>`}</div>
<div class="card"><h2>Usage this 9 weeks (${weekNo()})</h2><div class="tw"><table><tr><th>Student</th><th>Period</th>${ts.map(t=>`<th>${esc(t.name)} /${t.limit}</th>`).join("")}</tr>
${S.students.map(s=>`<tr><td>${esc(s)}</td><td>${esc((perOf(s)||{name:""}).name)}</td>${ts.map(t=>{const u=used(s,t.name);return`<td class="${u>t.limit?"over":""}">${u}</td>`}).join("")}</tr>`).join("")}</table></div></div>
<div class="card"><h2>Settings</h2>
<div class="row"><b>9 weeks:</b> start <input type="date" value="${S.p.start}" onchange="set('p.start',this.value)"> end <input type="date" value="${S.p.end}" onchange="set('p.end',this.value)"></div>
<div class="row"><b>No passes during first</b><input type="number" min="0" value="${S.bs}" onchange="set('bs',this.value,1)"> <b>and last</b><input type="number" min="0" value="${S.be}" onchange="set('be',this.value,1)"> <b>minutes of class</b></div><div class="row"><b>Students allowed out at once (per class period):</b><input type="number" min="1" value="${S.maxOut}" onchange="set('maxOut',this.value,1)"></div>
<h2 style="margin-top:14px">Pass limits per 9 weeks</h2>${ts.map((t,i)=>`<div class="row"><input value="${esc(t.name)}" onchange="set('types.${i}.name',this.value)"><input type="number" min="0" value="${t.limit}" onchange="set('types.${i}.limit',this.value,1)"><button class="d" onclick="rm('types',${i})">Remove</button></div>`).join("")}<button onclick="add('t')">+ Pass type</button>
<h2 style="margin-top:14px">Class periods</h2>${S.periods.map((p,i)=>`<div class="row"><input value="${esc(p.name)}" onchange="set('periods.${i}.name',this.value)"><input type="time" value="${p.start}" onchange="set('periods.${i}.start',this.value)"> to <input type="time" value="${p.end}" onchange="set('periods.${i}.end',this.value)"><button class="d" onclick="rm('periods',${i})">Remove</button></div>`).join("")}<button onclick="add('p')">+ Period</button>
<h2 style="margin-top:14px">Roster</h2>${S.students.map((s,i)=>`<div class="row"><span style="min-width:130px">${esc(s)}</span><select onchange="S.sp[S.students[${i}]]=this.value;save();render()">${S.periods.map(p=>`<option value="${p.id}" ${p.id===(perOf(s)||{}).id?"selected":""}>${esc(p.name)}</option>`).join("")}</select><button class="d" onclick="rm('students',${i})">×</button></div>`).join("")}<div class="row"><input id="ns" placeholder="Add student"><button onclick="add('s')">Add</button></div><div class="row"><b>Upload roster:</b><input type="file" accept=".xlsx,.xls,.csv,.pdf" onchange="upl(this)"></div><div class="mu">Spreadsheet: a Name (or First/Last) column and an optional Period column. PDF: one student per line, optionally ending with a period number.</div>
<h2 style="margin-top:14px">Sync across devices</h2><div class="row"><input id="sy-url" style="flex:1;min-width:240px" placeholder="Sync address (see setup steps)" value="${esc(U)}"><button onclick="setUrl()">Save</button><button onclick="cpLink()">Link for other devices</button></div><div class="mu">Every device needs the same sync address. “Link for other devices” gives a link that sets it automatically.</div><h2 style="margin-top:14px">Test clock</h2><div class="row"><button onclick="flip()">${S.sim.on?"Switch to real time":"Use test time"}</button><input type="datetime-local" value="${S.sim.t}" onchange="set('sim.t',this.value)"></div>
<button style="margin-top:10px" onclick="setPin()">Change teacher PIN</button> <button class="d" style="margin-top:10px" onclick="if(confirm('Reset everything?')){S=def();save();render()}">Reset all data</button></div>`}
render();
</script></body></html>
